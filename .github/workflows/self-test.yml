name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run stdlib-only self-test (exit codes 0/1/2)
        run: |
          chmod +x tools/memory_check.py tools/memory_guard.py
          python3 tests/self_test.py

      - name: Exec-mode sanity (git index must stay 100755)
        run: |
          M1=$(git ls-tree HEAD tools/memory_check.py | awk '{print $1}')
          M2=$(git ls-tree HEAD tools/memory_guard.py | awk '{print $1}')
          echo "memory_check.py: $M1  memory_guard.py: $M2"
          test "$M1" = "100755" || { echo "FAIL: memory_check.py lost exec mode in git"; exit 1; }
          test "$M2" = "100755" || { echo "FAIL: memory_guard.py lost exec mode in git"; exit 1; }
